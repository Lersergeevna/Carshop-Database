services:
  postgres:
    image: postgres:16
    container_name: carshop-postgres
    environment:
      POSTGRES_DB: car_shop
      POSTGRES_USER: carshop_user
      POSTGRES_PASSWORD: carshop_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: